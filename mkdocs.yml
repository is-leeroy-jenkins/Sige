site_name: Sige Documentation
site_description: Documentation for the Sige Streamlit analytics application.
site_author: Terry D. Eppler
site_url: ""

repo_url: ""
repo_name: "Sige-Py"

theme:
  name: material
  language: en
  logo: img/sige-logo.png
  favicon: img/favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/sige.css

extra_javascript:
  - assets/js/sige.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data: data.md
  - Workflows: workflows.md
  - User Guide:
      - Overview: user-guide/index.md
      - Installation: user-guide/installation.md
      - Data Loading: user-guide/data-loading.md
      - Data Overview: user-guide/data-overview.md
      - Descriptive Statistics: user-guide/descriptive-statistics.md
      - Inferential Statistics: user-guide/inferential-statistics.md
      - Feature Analysis: user-guide/feature-analysis.md
      - Dimensionality Reduction: user-guide/dimensionality-reduction.md
      - Clustering: user-guide/clustering.md
      - Anomaly Detection: user-guide/anomaly-detection.md
      - Export: user-guide/export.md
  - API Reference:
      - Overview: api/index.md
  - Development: development.md